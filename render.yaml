# Konfigurasi layanan backend di Render (https://render.com).
#
# Render membaca berkas ini saat repo dihubungkan lewat menu "Blueprints".
# Bisa juga diabaikan dan seluruh nilainya diisi manual di dashboard.
#
# Frontend TIDAK di-deploy di sini — frontend berada di Vercel dan meneruskan
# /api/* ke layanan ini lewat aturan rewrite pada frontend/vercel.json.
services:
  - type: web
    name: tourcation-api
    runtime: python
    plan: free
    region: singapore              # terdekat dari Indonesia
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    # $PORT wajib dipakai; Render menentukan portnya sendiri.
    # Dijalankan dari root repo agar engine.DATA_DIR ("data") tetap ketemu.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # sync: false = nilainya TIDAK disimpan di repo. Isi manual sekali di
      # dashboard Render (Environment -> Add Environment Variable).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      # Pembatasan laju fitur AI. Longgarkan bila perlu saat sesi penjurian.
      - key: RATE_AI_SEARCH_PER_JAM
        value: "15"
      - key: RATE_TRANSLATE_PER_JAM
        value: "40"
      - key: RATE_TRANSLATE_UI_PER_JAM
        value: "12"
      - key: RATE_PAGU_HARIAN
        value: "400"
      # --- Supabase: autentikasi & basis data ---------------------------
      # Tanpa nilai ini layanan tetap hidup; hanya endpoint berperan yang
      # membalas 401/503. Endpoint publik tidak terpengaruh.
      - key: SUPABASE_URL
        value: https://siqdhypesrprbrztucxw.supabase.co
      # RAHASIA — melewati seluruh Row Level Security. Isi manual di
      # dashboard Render, jangan pernah dituliskan di repo.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_ALG
        value: RS256
      # Pembatasan laju narasi AI pada dashboard. Hasilnya di-cache berdasarkan
      # sidik jari angkanya, jadi membuka halaman berulang tidak memakan kuota.
      - key: RATE_INSIGHT_PER_JAM
        value: "6"
      - key: RATE_GAP_PER_JAM
        value: "6"
      - key: RATE_ADVISOR_PER_JAM
        value: "10"
      - key: RATE_SIMULASI_PER_JAM
        value: "12"
      # Daftar email pemberi peran awal; isi manual saat dibutuhkan.
      - key: ADMIN_EMAILS
        sync: false
      # --- Peran GOV -----------------------------------------------------
      # GOV_EMAILS: daftar alamat PERSIS yang berperan GOV. Inilah yang dipakai
      # saat penjurian — domain uji coba sengaja tidak ada lagi (lihat bawah).
      - key: GOV_EMAILS
        sync: false
      # Nama lama untuk hal yang sama; dipertahankan agar konfigurasi lama tidak
      # putus. Boleh dikosongkan bila GOV_EMAILS sudah diisi.
      - key: GOV_DEMO_EMAILS
        sync: false
      # HANYA domain lembaga negara. JANGAN menambahkan domain uji coba: peran
      # GOV aktif seketika tanpa persetujuan siapa pun, dan GOV berwenang
      # memverifikasi usaha UMKM — domain yang bisa didaftarkan siapa saja
      # menjadi rantai eskalasi. Untuk demo, pakai GOV_EMAILS di atas.
      - key: GOV_EMAIL_DOMAINS
        value: go.id
      # --- Notifikasi verifikasi usaha (opsional) ------------------------
      # Pemberitahuan SELALU tercatat di tabel `notifikasi_gov` dan selalu
      # terbaca di dashboard. Variabel di bawah hanya menentukan apakah ia juga
      # dikirim sebagai surel; tanpa itu statusnya menetap ANTRE dan itu bukan
      # kerusakan. Format: "Kabupaten:alamat" dipisah koma.
      - key: GOV_NOTIFIKASI_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_DARI
        sync: false
